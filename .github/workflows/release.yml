name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run test:desktop
      - name: Build installer
        run: npm run build:desktop
      - name: Sign update manifest
        run: npm run sign:release
        env:
          REELSAVE_UPDATE_PRIVATE_KEY: ${{ secrets.REELSAVE_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ReelSave-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/release-manifest.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ReelSave-Windows
          path: release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
          $assets = @(Get-ChildItem release/*.exe,release/*.blockmap,release/latest.yml,release/release-manifest.json,release/release-manifest.sig | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME --draft --title "ReelSave $version" --notes "Windows desktop installer. Download ReelSave-Setup-$version.exe." @assets
