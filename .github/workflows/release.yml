name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm ci --prefix frontend
      - run: npm run test:desktop
      - run: python -m unittest test_youtube_fallback.py
      - name: Build installer
        run: npm run build:desktop
      - name: Sign update manifest
        run: npm run sign:release
        env:
          REELSAVE_UPDATE_PRIVATE_KEY: ${{ secrets.REELSAVE_UPDATE_PRIVATE_KEY }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ReelSave-Windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
            release/release-manifest.*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: ReelSave-Windows
          path: release
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version.' }
          $assets = @(Get-ChildItem release/*.exe,release/*.blockmap,release/latest.yml,release/release-manifest.json,release/release-manifest.sig | ForEach-Object FullName)
          gh release create $env:GITHUB_REF_NAME --draft --title "ReelSave $version" --notes "Windows desktop installer. Download ReelSave-Setup-$version.exe." @assets
